<body>
    <div id="header"></div>

    <div class="row my-4">
        <div class="col-12 col-md-4">
            <div class="row">
                <div class="col-12">

            <div class="row">
                <div class="col-12">
                    Displayed Guide
                </div>
            </div>

                        <div class="container-fluid guide-action-list"></div>

                        <div class="col-1">
                            <span class="guide-action-turn"></span>
                        </div>
                        <div class="col-4">
